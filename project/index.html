<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1 class="heading">Currency conveter</h1>
    <form>
      <div class="amount">
        <p class="para">Enter Amount</p>
        <input class="fild" type="text" name="" value="100" id="">


      </div>
      <div class="dropdown">
        <div class="form">
          <p class="para">Form</p>
          <div class="select-container">
            <img class="flag" src="https://flagsapi.com/BE/flat/64.png">

            <select class="elem" name="form" id="">
              <option value="USD">USD</option>
              <option value="INR">INR</option>
              <option value="EUR">ERU</option>
              <option value="AUD">AUD</option>


            </select>
          </div>
        </div>
        <div class="to">
          <p class="para">To</p>
          <div class="select-container">
            <img class="flag" src="https://flagsapi.com/IN/flat/64.png">

            <select class="elem" name="form" id="">
              <option value="USD">USD</option>
              <option value="INR" selected>INR</option>
              <option value="EUR">ERU</option>
              <option value="AUD">AUD</option>


            </select>


          </div>
        </div>
        <h3 class="heading3">1USD = 80INR</h3>
        <button class="btn">Get Exchange Rate</button>
    </form>

  </div>

</body>

</html>
